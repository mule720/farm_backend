apiVersion: apps/v1
kind: Deployment
metadata:
  name: agronexus-redis
  namespace: agronexus
  labels:
    app: agronexus-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agronexus-redis
  template:
    metadata:
      labels:
        app: agronexus-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 30
