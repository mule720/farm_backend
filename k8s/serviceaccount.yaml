# Workload Identity — links the K8s service account to a GCP service account
# The GCP service account needs these IAM roles:
#   - roles/cloudsql.client        (Cloud SQL Auth Proxy)
#   - roles/storage.objectAdmin    (GCS media bucket)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agronexus-sa
  namespace: agronexus
  annotations:
    # Replace PROJECT_ID with your GCP project ID
    iam.gke.io/gcp-service-account: agronexus-sa@PROJECT_ID.iam.gserviceaccount.com
