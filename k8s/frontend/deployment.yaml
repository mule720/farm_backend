apiVersion: apps/v1
kind: Deployment
metadata:
  name: agronexus-frontend
  namespace: agronexus
  labels:
    app: agronexus-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agronexus-frontend
  template:
    metadata:
      labels:
        app: agronexus-frontend
    spec:
      containers:
        - name: frontend
          image: REGION-docker.pkg.dev/PROJECT_ID/agronexus/frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
