name: Deploy AgroNexus Backend

# Was GKE-targeted (agronexus-cluster on the "agrinexus-farm" GCP project) -
# switched to the same Hostinger VPS the rest of the ecosystem now deploys
# onto, because that GCP project's GKE pipeline never actually succeeded
# (every run failed - see run history). See
# payment_backend/.github/workflows/deploy.yml for the original pattern
# this was copied from.
on:
  push:
    branches: [master, main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Django system checks
        env:
          SECRET_KEY: ci-dummy-key-not-used-in-production
          DEBUG: "True"
        run: python manage.py check --deploy 2>/dev/null || python manage.py check

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/farm/farm_backend
            git pull --ff-only
            docker build -t farm-backend:latest .

            docker stop farm-backend-web 2>/dev/null || true
            docker rm farm-backend-web 2>/dev/null || true
            # Port 8060 - next free port after the rest of the ecosystem
            # (Tourism 8000, Bus 8001, ERP 8002, Payment 8010, E-commerce
            # 8020, Shipping 8030, Notification 8040, Gateway 8050).
            docker run -d --name farm-backend-web --restart unless-stopped --network host \
              --env-file /var/www/farm/farm_backend/.env \
              farm-backend:latest \
              sh -c "python manage.py migrate --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8060 --config gunicorn.conf.py"

            docker image prune -f
