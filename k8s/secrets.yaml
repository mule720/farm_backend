# ─────────────────────────────────────────────────────────────────────────────
# AgroNexus — Kubernetes Secrets
#
# IMPORTANT: Never commit real values to git.
# The deploy.sh script creates this secret automatically using kubectl.
# Use this file only as a reference for what secrets are needed.
#
# To update a secret after first deploy:
#   kubectl edit secret agronexus-secrets -n agronexus
#
# To set a specific key:
#   kubectl patch secret agronexus-secrets -n agronexus \
#     --type=json \
#     -p='[{"op":"replace","path":"/data/ANTHROPIC_API_KEY","value":"'$(echo -n "sk-ant-..." | base64)'"}]'
#
# All values must be base64 encoded:
#   echo -n "your-value" | base64
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: agronexus-secrets
  namespace: agronexus
type: Opaque
data:
  # ── Django ──────────────────────────────────────────────────────────────────
  # 60+ character random string
  # python3 -c "import secrets,string; print(''.join(secrets.choice(string.ascii_letters+string.digits+'!@#%^&*(-_=+)') for _ in range(60)))" | base64
  SECRET_KEY: REPLACE_WITH_BASE64

  # Separate key for JWT signing
  # python3 -c "import secrets; print(secrets.token_hex(32))" | base64
  JWT_SIGNING_KEY: REPLACE_WITH_BASE64

  # ── PostgreSQL (Cloud SQL via Unix socket) ───────────────────────────────────
  #
  # Format:  postgresql://USER:PASSWORD@/DBNAME?host=/cloudsql/PROJECT:REGION:INSTANCE
  #
  # Example:
  #   postgresql://agronexus_user:MySecurePass@/agronexus?host=/cloudsql/my-project:us-central1:agronexus-db
  #
  # The /cloudsql/... host path is the Cloud SQL Auth Proxy Unix socket.
  # The proxy sidecar container in backend/deployment.yaml handles the connection.
  # No IP address needed — the proxy manages the secure tunnel automatically.
  #
  # echo -n "postgresql://agronexus_user:PASSWORD@/agronexus?host=/cloudsql/PROJECT:REGION:agronexus-db" | base64
  DATABASE_URL: REPLACE_WITH_BASE64

  # ── Anthropic AI API ────────────────────────────────────────────────────────
  # Get from: https://console.anthropic.com/settings/keys
  # echo -n "sk-ant-api03-..." | base64
  ANTHROPIC_API_KEY: REPLACE_WITH_BASE64

  # ── Email (SendGrid SMTP) ────────────────────────────────────────────────────
  # SendGrid: EMAIL_HOST_USER is always the literal string "apikey"
  # echo -n "apikey" | base64
  EMAIL_HOST_USER: REPLACE_WITH_BASE64
  # Get from: https://app.sendgrid.com/settings/api_keys
  # echo -n "SG.your-api-key-here" | base64
  EMAIL_HOST_PASSWORD: REPLACE_WITH_BASE64
